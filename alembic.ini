# Alembic config. The DB URL is injected from app settings in alembic/env.py,
# so it is intentionally left blank here.
#
# The logging sections below apply to `alembic upgrade head` run by hand, and
# to nothing else. When the app runs migrations on startup it passes
# configure_logger=False (app/db.py) and env.py skips fileConfig entirely, so
# this file no longer decides how the running server logs -- app/logging.py
# does. Editing these sections will not change one line the API prints.
[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
# The format had no %(asctime)s, which made the datefmt below dead config and
# left every line the CLI printed unstamped -- there was no way to tell which
# run of a migration a line came from. The offset is printed rather than
# assumed because the app's own logs are UTC with a trailing Z
# (app/logging.py) and the two must not be read as the same clock: this line
# is the operator's local time, +0900 on the machine this is usually run from.
format = %(asctime)s %(levelname)-8s [%(name)s] %(message)s
datefmt = %Y-%m-%dT%H:%M:%S%z
