# Full stack: `docker compose up` brings up the database, both models, the API
# and the proxy. The first start downloads the model weights into the hf-cache
# volume (~6.9GB on disk); later starts reuse it.
services:
  db:
    image: pgvector/pgvector:pg16
    # 크래시나 호스트 재부팅에서 스스로 돌아온다. `docker compose down`으로
    # 명시적으로 내린 것은 다시 올리지 않는다 — unless-stopped의 뜻 그대로다.
    # 로컬에서 매번 내렸다 올리는 것과는 무관하다(down이 아니라 죽었을 때만
    # 반응). 아래 모든 서비스에 같은 이유로 붙어 있다.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # 기본값은 로컬 편의용이다. 공개 호스트에 올린다면 .env 에서 반드시
      # 바꿀 것 — 기본 비밀번호는 제일 먼저 시도되는 값이다.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-docs_rag}
    # 루프백에만 바인딩한다. 앞의 "5432:5432" 는 0.0.0.0 에 열려 서버에
    # 올리는 순간 인터넷에서 DB 로 직접 붙는 시도가 가능했다. 앱은 compose
    # 네트워크로 닿으므로 이 publish 는 호스트 개발 편의를 위한 것뿐이다.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The app applies migrations at startup, so it must not start before the
      # database can actually answer.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-docs_rag}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # BGE-M3 + bge-reranker-v2-m3 on CPU.
  #
  # ⚠️ Reranking cost depends on chunk *length*, not just candidate count, and
  # real chunks are ~700 tokens. Measured in this container with chunks that
  # size — not with the short clauses the eval corpora use:
  #
  #     CAND_K 10 ->  29s        CAND_K 50 -> 184s
  #
  # 184s is past the client's 120s timeout, so a query over a real document
  # fails with 503 "search unavailable". More threads do not help (10 threads
  # measured slower than 4). The same 50 pairs take 10.6s on Apple MPS.
  #
  # So this service is for hosts with a GPU, or for corpora of small chunks.
  # On Apple Silicon run the model server on the host and point the app at it
  # with MODEL_URL — a container here cannot reach Metal.
  models:
    # Tagged so there is something to roll back *to*. Without an explicit
    # image name compose overwrites one implicit :latest on every build, and
    # the previous version stops existing.
    image: docs-rag-models:${MODELS_TAG:-dev}
    build:
      context: .
      dockerfile: Dockerfile.models
    restart: unless-stopped
    environment:
      OMP_NUM_THREADS: ${MODEL_THREADS:-4}
    # Not published: only `app` talks to it, over the compose network. Leaving
    # it unpublished also keeps it out of the way of a host-side
    # `python -m scripts.local_model_server`, which uses the same port to run
    # the same models on the GPU.
    expose:
      - "8081"
    volumes:
      - hf-cache:/opt/hf

  # GPU 대안(임베딩) — NVIDIA 호스트용. 기본으로는 안 뜬다(`--profile gpu`):
  # macOS Docker 는 GPU 패스스루가 없어 이 서비스가 실패하면 이 기계에서는
  # `docker compose up` 자체가 깨지기 때문이다.
  #
  # 이 서비스는 임베딩(BGE-M3)만 서빙한다. 리랭킹(bge-reranker-v2-m3)은 다른
  # 모델이라 TEI 컨테이너 하나가 둘을 겸할 수 없다 — 이것만 띄우고 RERANK_URL
  # 을 안 바꾸면 리랭킹은 여전히 기본으로 항상 뜨는 `models` 컨테이너의 CPU
  # 에서 돈다(바로 이 파일 위쪽에 적힌 184초 문제 그대로). 리랭킹까지 GPU 로
  # 돌리려면 아래 `tei-rerank` 도 함께 띄우고 RERANK_MODEL_URL 로 가리킬 것.
  tei:
    profiles: ["gpu"]
    image: ghcr.io/huggingface/text-embeddings-inference:1.5
    command: ["--model-id", "BAAI/bge-m3"]
    restart: unless-stopped
    # db와 같은 이유로 루프백에만 바인딩한다 — 앱은 compose 네트워크로 닿으므로
    # host publish는 호스트에서 직접 찔러볼 때(디버깅·eval 스크립트)의 편의일
    # 뿐이다. 예전엔 0.0.0.0 에 열려 있어 공개 호스트에서 인터넷에 그대로
    # 노출됐다.
    ports:
      - "127.0.0.1:${TEI_PORT:-8080}:80"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # tei의 리랭커 짝. 이미지는 같고 모델만 다르다 — TEI는 인스턴스 하나당
  # 모델 하나만 서빙해서, 임베딩·리랭킹을 둘 다 GPU로 돌리려면 컨테이너가
  # 둘이어야 한다(호스트의 scripts/local_model_server.py는 반대로 프로세스
  # 하나에서 두 모델을 다 올린다 — TEI는 그 구성을 흉내 낼 수 없다).
  tei-rerank:
    profiles: ["gpu"]
    image: ghcr.io/huggingface/text-embeddings-inference:1.5
    command: ["--model-id", "BAAI/bge-reranker-v2-m3"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TEI_RERANK_PORT:-8082}:80"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  app:
    image: docs-rag-app:${APP_TAG:-dev}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # GEMINI_API_KEY and any tuning overrides come from .env; the values below
    # are container addresses that .env (written for host processes) must not win.
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-docs_rag}
      # 기본은 compose 안의 CPU 모델 서비스. MODEL_URL 로 외부 서버 하나가
      # 임베딩·리랭킹을 모두 맡게 할 수 있다 — 애플 실리콘에서는 호스트의
      # MPS 서버가 유일하게 실용적인 선택이다:
      #   MODEL_URL=http://host.docker.internal:8081 docker compose up -d app
      # 임베딩과 리랭킹을 서로 다른 서버로 나눠야 하면(예: --profile gpu 의
      # tei/tei-rerank) EMBED_MODEL_URL / RERANK_MODEL_URL 을 따로 준다 —
      # 있으면 MODEL_URL 보다 우선한다:
      #   EMBED_MODEL_URL=http://tei:80 RERANK_MODEL_URL=http://tei-rerank:80 \
      #     docker compose --profile gpu up -d
      TEI_URL: ${EMBED_MODEL_URL:-${MODEL_URL:-http://models:8081}}
      RERANK_URL: ${RERANK_MODEL_URL:-${MODEL_URL:-http://models:8081}}
      STORAGE_DIR: /srv/storage
      # Empty leaves /admin/stats returning 404. Set ADMIN_TOKEN in .env to
      # turn the operational view on.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Trust X-Forwarded-For, so the per-IP rate limit sees real clients
      # instead of the proxy. Safe *because this service is never published*:
      # only `proxy` can reach it, so nobody can forge the header from outside.
      # If you ever add a `ports:` entry here, narrow this first.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - uploads:/srv/storage
    depends_on:
      db:
        condition: service_healthy
      # Deliberately not service_healthy: the first model download takes
      # minutes, and the API has nothing to say about it. Requests that arrive
      # early get 503 "search unavailable" instead of the stack refusing to start.
      models:
        condition: service_started
    expose:
      - "8000"

  # Next.js 프론트엔드. API 주소는 빌드 인자로 굳는데(NEXT_PUBLIC_* 은 런타임이
  # 아니라 번들에 박힌다), 값이 상대 경로라 이미지가 호스트에 묶이지 않는다.
  # 그 전제는 프록시가 만든다 — 같은 오리진에서 /api 를 백엔드로 보낸다.
  web:
    image: docs-rag-web:${WEB_TAG:-dev}
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE: /api
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - app

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    # Host ports are overridable because 80/443 are often already taken on a
    # development machine. In production set HTTP_PORT=80 and HTTPS_PORT=443 —
    # certificate issuance needs the real ports to be reachable.
    ports:
      - "${HTTP_PORT:-8088}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
      - web

volumes:
  pgdata:
  hf-cache:
  uploads:
  caddy-data:
  caddy-config:
