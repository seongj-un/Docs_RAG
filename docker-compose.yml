services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docs_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # BGE-M3 embeddings. Requires a GPU; on CPU-only hosts run TEI elsewhere
  # (Colab / cloud GPU) and point TEI_URL at it instead.
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:1.5
    command: ["--model-id", "BAAI/bge-m3"]
    ports:
      - "8080:80"
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  pgdata:
